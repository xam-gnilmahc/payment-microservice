<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/css/style.css">
<style>body{padding:40px;background:#f5f6f8}.card{max-width:520px;margin:0 auto}</style>
</head><body>
<div class="card" style="display:block!important">
  <div class="card-header"><div class="card-title">Pay with Card</div></div>
  <div id="wallet-skeleton" class="show">
    <div class="skel-wallet-stack">
      <div class="skel-wallet-btn"></div>
      <div class="skel-wallet-btn"></div>
      <div class="skel-wallet-btn"></div>
    </div>
  </div>
  <div class="separator"><span class="separator-line"></span><span class="separator-text">or pay with card</span><span class="separator-line"></span></div>
  <div class="form-group"><label>Card Details</label></div>
  <div class="card-skeleton show">
    <div class="skel-card-field"></div>
    <div class="skel-card-field"></div>
    <div class="skel-card-field"></div>
  </div>
  <button class="btn btn-primary" style="margin-top:20px" disabled>Pay Now</button>
</div>
</body></html>
